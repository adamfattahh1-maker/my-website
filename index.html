<!DOCTYPE html>
<html>
<head>
  <title>Location Sharing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #96BFFF;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }

    input, button {
      padding: 12px;
      margin: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #EE8C62;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>📍 Location Sharing</h1>

    <p>Enter your phone number:</p>

    <input id="phone" type="tel" placeholder="+123456789">

    <br>

    <button onclick="shareLocation()">Share My Location</button>

    <div id="result"></div>
  </div>

  <script>
    function shareLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.innerHTML = "Your browser does not support location sharing.";
        return;
      }

      result.innerHTML = "Requesting your location...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          result.innerHTML =
            "Location shared successfully!<br><br>" +
            "Latitude: " + lat + "<br>" +
            "Longitude: " + lon;
        },
        function() {
          result.innerHTML =
            "Location wasn't shared. Please allow location permission.";
        }
      );
    }
  </script>
</body>
</html>
